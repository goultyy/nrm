# complex.conf - exercises the awkward parts of nginx syntax
worker_processes  auto;   # trailing comment
events { worker_connections 1024; }

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream app_backend {
        least_conn;
        server 10.0.0.1:8080 weight=3 max_fails=2 fail_timeout=30s;
        server 10.0.0.2:8080 backup;
        keepalive 32;
    }

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s;

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name example.com www.example.com *.example.org;

        ssl_certificate     /etc/ssl/certs/example.pem;
        ssl_certificate_key /etc/ssl/private/example.key;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Everything else goes to the app
        location / {
            proxy_pass http://app_backend;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location ~* \.(?:css|js|png)$ { expires 30d; access_log off; }
        location = /health { return 200 "ok\n"; add_header Content-Type text/plain; }
        location @fallback { return 502; }

        if ($request_method = POST) { return 405; }

        location /lua {
            content_by_lua_block {
                local cjson = require "cjson"
                ngx.say(cjson.encode({ hello = "world}" }))
                -- a comment with a } brace
            }
        }

        rewrite ^/old/(.*)$ /new/$1 permanent;
        set $foo "${bar}baz";
        location ~ "^/a b/" { return 404; }
    }

    server { listen 80; server_name a.example.com; return 301 https://$host$request_uri; }
}
